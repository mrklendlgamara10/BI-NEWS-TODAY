<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Media Monitoring Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #003366;
            color: white;
            padding: 20px 30px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 22px;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .info-text {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏛️ Bureau of Immigration - Media Monitoring Dashboard</h1>
    </header>

    <div class="container">
        <h3>Live Philippine News Coverage</h3>
        <p class="info-text">Real-time coverage across GMA, ABS-CBN, Inquirer, Philstar, TV5, Manila Bulletin, and broadsheets.</p>
        
        <!-- Official Google Programmable Search Script -->
        <script async src="https://cse.google.com/cse.js?cx=b0e77469a473e4a98"></script>
        <div class="gcse-searchresults-only" data-gss="1" data-queryParameterName="q" defaultToQuery='"Bureau of Immigration" OR "BI NAIA" OR "Immigration Philippines"'></div>
    </div>

</body>
</html>
